feishu:
  app_id: "cli_REPLACE_ME"
  app_secret: "REPLACE_ME"
  domain: "https://open.feishu.cn"
  roles:
    boss: ""
    manager: ""
    finance: ""
    legal: ""
    audit: ""

llm:
  provider: local
  local:
    base_url: "http://127.0.0.1:8000/v1"
    api_key: "local-not-checked"
    model_extract: "Qwen/Qwen3.8-27B-Instruct"
    model_review: "Qwen/Qwen3.8-27B-Instruct"
    review_temperature: 0.1
    guided_json: true
  cloud:
    enabled: false
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4.6"
    api_key_env: "ZHIPU_API_KEY"

daily_report:
  time: "18:00"
  boss_user_id: "REPLACE_ME"

permissions:
  company_report_default_for_managers: false
  confidential_visible_roles: [BOSS, AUDIT]

matrix:
  active:
    reimburse: "config/matrix/reimburse_v1.yaml"

storage:
  db_path: "data/secretary.db"
  audit_dir: "data/audit"

allowances:
  max_manager_grant: 1000
  default_expire_days: 30

budgets:
  block_over: false

# 发票验真：provider=none 仅本地形式验真+二维码交叉核验（免费）；
# 接第三方付费接口（百望/票易通等）时改 provider 并补 api_key
invoice_verify:
  provider: none
  api_key: ""

# 金蝶凭证导出：科目代码/映射按贵司账套调整（默认管理费用 6601xx）
kingdee:
  subject_map:
    交通: "660106"
    餐饮: "660107"
    住宿: "660103"
    办公: "660101"
    其他: "660199"
  payable_code: "2241"   # 其他应付款
  bank_code: "1002"      # 银行存款
  dept_map: {}           # D1: "BM001"
  encoding: "gbk"

contracts:
  expiry_warn_days: 30
legal:
  review_points:
    - 付款方式与节点明确
    - 含违约责任条款
    - 含验收标准
    - 争议解决方式

audit:
  sampling_top: 10
  weights:
    suggest_threshold: 40
