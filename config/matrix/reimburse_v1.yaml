matrix: reimburse
version: 1
hit_policy: FIRST
inputs:
  - {name: expense_type, type: string, enum: [交通, 餐饮, 住宿, 办公, 其他]}
  - {name: amount, type: number}
  - {name: rule_result, type: string, enum: [PASS, WARN, FAIL]}
  - {name: llm_verdict, type: string, enum: [PASS, WARN, FAIL]}
outputs:
  - {name: action, type: string}
  - {name: notify, type: list}
rules:
  - {id: M01, cells: {expense_type: 交通, amount: "<=500",    rule_result: PASS, llm_verdict: PASS}, then: {action: AUTO_APPROVE}}
  - {id: M02, cells: {expense_type: 餐饮, amount: "<=2000",   rule_result: PASS, llm_verdict: PASS}, then: {action: MANAGER}}
  - {id: M07, cells: {rule_result: FAIL},                                                              then: {action: MANUAL_REVIEW}}
  - {id: M03, cells: {amount: "<=5000"},                                                               then: {action: MANAGER}}
  - {id: M04, cells: {amount: "5001-50000"},                                                           then: {action: MANAGER_BOSS}}
  - {id: M05, cells: {amount: ">50000"},                                                               then: {action: MANAGER_BOSS_FINANCE_CONSIGN, notify: [finance]}}
  - {id: M99, cells: {},                                                                               then: {action: MANUAL_REVIEW}}
