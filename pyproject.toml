[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-secretary"
version = "1.0.0"
description = "AI 秘书：飞书收单 → AI 抽取/审查 → 责任矩阵审批 → 日报/异常检测"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "lark-oapi>=1.4",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
slack = ["slack_sdk>=3.27"]
wecom = ["pycryptodome>=3.19"]
report = ["matplotlib>=3.8", "python-docx>=1.1", "python-pptx>=0.6.23"]
qr = ["opencv-python>=4.9", "numpy>=1.26"]
pdf = ["pypdf>=4.0"]
all = [
    "slack_sdk>=3.27",
    "pycryptodome>=3.19",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.scripts]
boss-feishu = "boss_secretary.feishu:main"
boss-secrets = "boss_secretary.secrets:main"
boss-matrix = "boss_secretary.core.matrix:main"
boss-compliance = "boss_secretary.core.compliance:main"
boss-anomaly = "boss_secretary.core.anomaly:main"
boss-daily = "boss_secretary.report.daily:main"
boss-models = "boss_secretary.models:main"
boss-watchdog = "boss_secretary.watchdog:main"
boss-telegram = "boss_secretary.ingress.telegram:main"
boss-wecom = "boss_secretary.ingress.wecom:main"
boss-slack = "boss_secretary.ingress.slack:main"
boss-budget = "boss_secretary.budget:main"
boss-voucher = "boss_secretary.finance.export:main"
boss-report = "boss_secretary.report.monthly:main"

[tool.setuptools.packages.find]
include = ["boss_secretary*"]
