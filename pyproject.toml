[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-secretary"
version = "0.1.0"
description = "AI 秘书：飞书收单 → AI 抽取/审查 → 责任矩阵审批 → 日报/异常检测"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "lark-oapi>=1.4",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
boss-feishu = "boss_secretary.feishu:main"
boss-secrets = "boss_secretary.secrets:main"
boss-matrix = "boss_secretary.core.matrix:main"
boss-compliance = "boss_secretary.core.compliance:main"
boss-anomaly = "boss_secretary.core.anomaly:main"
boss-daily = "boss_secretary.report.daily:main"
boss-models = "boss_secretary.models:main"

[tool.setuptools.packages.find]
include = ["boss_secretary*"]
